[package]
name = "mycelium-cli"
version.workspace = true
description = "myc — the one-command toolchain driver (M-733): `myc init|build|check|test|run` over a Mycelium phylum, with DN-22 structured, actionable diagnostics (never a raw panic; G2). Orchestrates the real library APIs (mycelium-proj/-spore/-l1) directly — no fragile subprocess plumbing. KC-3: above the kernel."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# S-HOST-REGISTRY (WP-4): install the default `@std-sys` wild: host-op table before `myc run`
# evaluation. On by default so production `myc run` grants floor ops. Disable with
# `--no-default-features` to compile/test without host-registry (empty wild: table — G2 loud fail).
# Pulls mycelium-std-sys-host with its own `host-registry` feature (install_default_host_ops).
default = ["host-registry"]
host-registry = ["dep:mycelium-std-sys-host"]
# S-STD-NET (WP-6): optional wild:http_request install via mycelium-std-net. Off by default —
# ambient network is not part of the floor; enable with `--features net-host` for ports that need
# HTTPS (gha-runner-ctl, tg-agent-relay). Pulls mycelium-std-net with its `host-registry` feature
# (`install_http_host_ops`). Independent of `host-registry` (can enable either or both).
net-host = ["dep:mycelium-std-net"]

[dependencies]
# Project manifest parsing (M-359) + the content-addressed spore build/registry (M-368/M-732).
mycelium-proj = { git = "https://github.com/tzervas/mycelium-proj", rev = "3209a570c472cd8a94c52f8562cbbfd07c12f322" }
mycelium-spore = { git = "https://github.com/tzervas/mycelium-spore", rev = "7dc1ca165d42191aa0b26b8d1d42fcd2ddd5945b" }
# The L1 front-end: parse + type-check, so `myc check` is a real (not stubbed) verification.
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "31f7aaa956cca0e1c7a894eeaff4d10d58b5b2b8" }
# The trusted reference interpreter (M-908): `myc run` v0 elaborates the checked nodule to closed
# L0 Core IR and evaluates it here — the same trusted execution path the differential suite pins.
# Pinned to mycelium-runtime main (HostCallRegistry / register_host / has_host / install_host_ops).
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "cb3a96348f718661dbd3db43224a036df272e177" }
# The shared CLI substrate (M-643): the `.myc` source walk + read helpers, reused not re-rolled.
mycelium-cli-common = { git = "https://github.com/tzervas/mycelium-cli-common", rev = "28e81b67a5d21bc3bdf8904a6ce36dd9ccb515b9" }
# Production host wiring (RFC-0028 §4.5): default wild: table via `install_default_host_ops`.
# Optional — see feature `host-registry`. Pin: mycelium-std-sys-host main (process floor + time/rand).
# Must enable the dep's `host-registry` feature so `install_default_host_ops` is exported.
mycelium-std-sys-host = { git = "https://github.com/tzervas/mycelium-std-sys-host", rev = "e2ff385a527271126bd7b86a0041f5c6fc747b03", optional = true, features = ["host-registry"] }
# S-STD-NET / WP-6: wild:http_request via `install_http_host_ops`. Optional — see feature `net-host`.
# Pin: mycelium-std-net main tip. Enable the dep's `host-registry` feature for the install surface.
mycelium-std-net = { git = "https://github.com/tzervas/mycelium-std-net", rev = "c452977c996b61ca1a811e7662d360500cf77d4b", optional = true, features = ["host-registry"] }

[[bin]]
name = "myc"
path = "src/bin/myc.rs"

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-cli"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
